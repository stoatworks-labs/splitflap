  <body>
    <main id="demo">
      <noscript>
        <h1>Splitflap</h1>
        <p>
          An FFGL effect that shows your clip on a split-flap departures board.
          Every cell is a drum of flaps that can only turn forwards, one flap at
          a time, at the motor's rate, and every flap in the air is a hinged
          plate falling under gravity and slapping onto the stop. A change
          ripples across the board, a step brighter is one flip and a step
          darker is the whole way round the drum, a moving picture is never
          finished, and the drum can be printed with tones, a palette or a
          message.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/splitflap">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/splitflap/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/splitflap">Source on GitHub</a></li>
        </ul>
